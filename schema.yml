          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        stock_qty:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        product:
