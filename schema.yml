      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourierList'
          description: ''
    post:
      operationId: company_couriers_create
      description: The company hires its own riders; stores never create one.
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
