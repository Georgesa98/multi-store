components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - variant
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 50
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        notes:
          type: string
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - line1
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 50
        line1:
          type: string
          minLength: 1
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
      required:
      - city
      - line1
    ApplyCouponRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
      required:
      - code
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - role
      - user
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        store:
          allOf:
          - $ref: '#/components/schemas/StoreBrief'
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        coupon:
          allOf:
          - $ref: '#/components/schemas/CouponBrief'
          readOnly: true
          nullable: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - coupon
      - created_at
      - discount_total
      - id
      - items
      - store
      - subtotal
      - total
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/CartVariant'
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - line_total
      - variant
