      description: Pick a permission class per method; keeps every view explicit.
      parameters:
      - in: query
        name: is_available
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, email or phone
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
