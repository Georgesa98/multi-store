          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 160
        description:
          type: string
        address_text:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
        cover:
          type: string
          format: uri
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        currency:
          type: string
          maxLength: 3
        is_open:
          type: boolean
          readOnly: true
        phone:
          type: string
          maxLength: 32
        opening_hours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
          readOnly: true
        delivery_companies:
          type: array
          items:
            $ref: '#/components/schemas/PublicCompany'
          readOnly: true
      required:
      - delivery_companies
      - id
      - is_open
      - name
      - opening_hours
      - slug
    StoreStatusEnum:
      enum:
      - pending
      - active
      - suspended
      - closed
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `suspended` - Suspended
        * `closed` - Closed
    SuspendCompanyRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    SuspendStoreRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - last_login
      - role
    UserBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_active
      - phone
    UserRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          maxLength: 32
      required:
      - full_name
    VariantCreateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          default: Default
          maxLength: 60
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        compare_at_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        stock_qty:
          type: integer
          minimum: 0
          default: 0
        sku:
          type: string
          default: ''
          maxLength: 64
        is_active:
          type: boolean
          default: true
      required:
      - price
    VehicleEnum:
      enum:
      - motorcycle
      - car
      - bicycle
      - on_foot
      type: string
      description: |-
        * `motorcycle` - Motorcycle
        * `car` - Car
        * `bicycle` - Bicycle
        * `on_foot` - On foot
    ZoneBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        min_order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        eta_minutes:
          type: integer
          readOnly: true
      required:
      - eta_minutes
      - fee
      - id
      - min_order_total
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Authentication and account self-service
