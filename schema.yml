components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - role
      - user
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        parent:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        parent:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - name
    Courier:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/CourierUser'
          readOnly: true
        vehicle:
          type: string
          readOnly: true
        plate:
          type: string
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        avg_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        deliveries_count:
          type: integer
          readOnly: true
      required:
      - avg_rating
      - deliveries_count
      - id
      - is_available
      - plate
      - user
      - vehicle
    CourierInviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          default: ''
          maxLength: 32
      required:
      - email
      - full_name
    CourierUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_active
      - phone
    DeliveryQuoteRequest:
      type: object
      properties:
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - lat
      - lng
    DeliveryZone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        center_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        center_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        min_order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        eta_minutes:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - center_lat
      - center_lng
      - created_at
      - fee
      - id
      - name
      - radius_km
    DeliveryZoneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        center_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        center_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        min_order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        eta_minutes:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - center_lat
      - center_lng
      - fee
      - name
      - radius_km
    DeviceToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - token
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - token
    InventoryMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          readOnly: true
        variant_label:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        delta:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - delta
      - id
      - note
      - product_name
      - reason
      - variant
      - variant_label
    LoginRequest:
      type: object
      description: Email + password, with the user payload the apps need after login.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MemberRoleEnum:
      enum:
      - owner
      - manager
      - staff
      type: string
      description: |-
        * `owner` - Owner
        * `manager` - Manager
        * `staff` - Staff
    OpeningHours:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weekday:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0 = Monday … 6 = Sunday
        open_time:
          type: string
          format: time
        close_time:
          type: string
          format: time
        is_closed:
          type: boolean
      required:
      - close_time
      - id
      - open_time
      - weekday
    OpeningHoursBulkRequest:
      type: object
      properties:
        hours:
