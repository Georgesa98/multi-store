openapi: 3.0.3
info:
  title: Multi-Store Marketplace & Delivery API
  version: 1.0.0
  description: |-
    Customer, store dashboard, courier and platform surfaces for a multi-store marketplace with per-store cash-on-delivery fulfilment.

    Errors answer `{"detail": ..., "code": ...}` for object-level failures; `code` is stable, so branch on it rather than the prose. `409` is an illegal state transition, `422` a broken business rule (stock, minimum order, zone), `429` throttling. Field validation keeps DRF's `{"field": ["..."]}` shape with no top-level `code`.
paths:
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Public signup. Returns the new user with an access and refresh
        token pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Create a customer account
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Email and password in, access and refresh tokens out, with the
        user's role and profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Sign in
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchanges a valid refresh token for a new access token and, because
        rotation is on, a new refresh token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Refresh an access token
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Sign out
      description: Blacklists the supplied refresh token so it cannot be replayed.
        The access token expires on its own within 15 minutes.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: 'The signed-in user''s account: email, name, phone and role.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Get your profile
    patch:
      operationId: auth_me_partial_update
      description: Partial update of the writable profile fields, the name and phone.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Update your profile
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Requires the current password. The new one must pass the configured
        password validators.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Change your password
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Emails a single-use reset link to the address. Always answers 204,
        so the endpoint cannot be used to enumerate accounts.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Request a password reset
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Takes the token from the emailed link and the new password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Complete a password reset
  /api/v1/auth/device-tokens/:
    get:
      operationId: auth_device_tokens_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceTokenList'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: List your device tokens
      description: The push tokens registered for this account. Paginated and orderable
        like every list.
    post:
      operationId: auth_device_tokens_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Register a device token
      description: Stores an FCM token for push notifications, or reactivates the
        same token if it is already known.
  /api/v1/auth/device-tokens/{id}/:
    delete:
      operationId: auth_device_tokens_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Remove a device token
      description: Stops push notifications to that device. Only the owner's tokens
        are visible; anyone else's is 404.
  /api/v1/company/profile/:
    get:
      operationId: company_profile_retrieve
      description: Scoped to `request.company`. Status and commission rate are platform-run
        and read-only.
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCompany'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Get your delivery company
    patch:
      operationId: company_profile_partial_update
      description: Partial update of the company profile.
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeliveryCompanyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCompany'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Update your delivery company
  /api/v1/company/members/:
    get:
      operationId: company_members_list
      description: Memberships of `request.company`, with each member's role and active
        flag.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyMembershipList'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: List the company's team
  /api/v1/company/members/invite/:
    post:
      operationId: company_members_invite_create
      description: Creates a delivery-staff account, or attaches an existing one,
        to the company. Owner and manager only.
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMemberInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyMemberInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyMemberInviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Invite a team member
  /api/v1/company/members/{id}/:
    patch:
      operationId: company_members_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyMembershipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyMembershipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyMembershipRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Update a team member
      description: Changes role or active state. The owner's role is fixed, and a
        member of another company is 404.
  /api/v1/company/couriers/:
    get:
      operationId: company_couriers_list
      description: The riders employed by `request.company`. Filter with `is_available`,
        search with `q`.
      parameters:
      - in: query
        name: is_available
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, email or phone
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourierList'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: List the company's couriers
    post:
      operationId: company_couriers_create
      description: Creates a courier account tied to this company. Stores never create
        couriers, only the company that employs them does.
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourierCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourierCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Hire a courier
  /api/v1/company/couriers/{id}/:
    patch:
      operationId: company_couriers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourierUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourierUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourierUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Update a courier
      description: 'Vehicle, plate and availability. Set `is_active: false` to end
        the employment without deleting history.'
  /api/v1/company/zones/:
    get:
      operationId: company_zones_list
      description: 'The company''s coverage areas: centre, radius, fee, minimum order
        and ETA.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeliveryZoneList'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: List delivery zones
    post:
      operationId: company_zones_create
      description: A new coverage area. The fee and minimum order set here are what
        checkout quotes to customers.
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryZoneRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryZoneRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Create a delivery zone
  /api/v1/company/zones/{id}/:
    get:
      operationId: company_zones_retrieve
      description: One zone of `request.company`; another company's zone is 404.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
          description: ''
        '429':
          description: Too many requests for this endpoint. `Retry-After` carries
            the number of seconds to wait before retrying.
          headers:
            Retry-After:
              description: Seconds until the next request is allowed.
              schema:
                type: integer
          content:
