          - invalid
          - parse_error
          - authentication_failed
          - not_authenticated
          - permission_denied
          - not_found
          - method_not_allowed
          - not_acceptable
          - unsupported_media_type
          - conflict
          - invalid_transition
          - business_rule
          - throttled
          - account_locked
        request_id:
          type: string
          description: The correlation id, the same value as the `X-Request-ID` response
            header. Quote it when reporting a failure.
      required:
      - detail
      - code
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
