# Multi-Store — API, workers, Postgres and Redis in one file.
#
# Deployed at https://multi-store.georgesalebe.me (DNS already points here).
#
# Local:    docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#           API       http://localhost:8000/api/v1/
#           Docs      http://localhost:8000/api/docs/   (credentials from .env)
#           Health    http://localhost:8000/healthz/
#
# Coolify:  create a Docker Compose resource from this repository, leave the
#           compose path at /docker-compose.yml, add the variables below under
#           Environment Variables, then under Domains add a domain for the
#           `api` service: https://multi-store.georgesalebe.me:8000
#           The :8000 suffix is the container port daphne listens on; the public
#           request still uses 443. Do not publish that port as a host port —
#           Coolify's docs are explicit that a published port bypasses proxy
#           routing (and there is a `local` override for exactly that reason).
#
# Nothing here publishes a port to the host: the proxy terminates TLS and
# reaches `api` over the compose network.

name: multi-store

x-app: &app
  build:
    context: ./backend
  image: multi-store-backend:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
    DEBUG: "False"
    # The public hostname, plus loopback for the in-container healthcheck and
    # `docker compose exec`. Drop `*` before going anywhere real.
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-multi-store.georgesalebe.me,localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://multi-store.georgesalebe.me}
    DATABASE_URL: postgres://${POSTGRES_USER:-multistore}:${POSTGRES_PASSWORD:-multistore}@db:5432/${POSTGRES_DB:-multistore}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Browser origins for the dashboard (not the API host) and the base URL
    # password-reset links point at; neither client is deployed yet.
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    REPORT_TIME_ZONE: ${REPORT_TIME_ZONE:-Asia/Damascus}
    # Empty credentials hide the docs (404) in production. Set both.
    DOCS_AUTH_USER: ${DOCS_AUTH_USER:-}
    DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:-}
    # Traefik terminates TLS and forwards X-Forwarded-Proto, so the redirect is
    # safe here. A plain-http local run needs SECURE_SSL_REDIRECT=False.
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multistore}
      POSTGRES_USER: ${POSTGRES_USER:-multistore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multistore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-multistore} -d ${POSTGRES_DB:-multistore}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["api"]
    expose:
      - "8000"
    volumes:
      # Uploads (product images, logos, proof photos) outlive the container.
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["worker"]
    volumes:
      - media:/app/media

  beat:
    <<: *app
    command: ["beat"]
    volumes:
      - media:/app/media

volumes:
  pgdata:
  redisdata:
  media:
